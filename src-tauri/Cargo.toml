[package]
name = "ytdlp-gui"
version = "0.1.0"
description = "A desktop GUI for yt-dlp"
authors = ["yt-dlp gui contributors"]
edition = "2021"

[lib]
name = "ytdlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
shell-words = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
